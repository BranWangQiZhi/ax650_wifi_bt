# Wi-Fi 配置（被 scripts/wifi-ap.sh 和 scripts/wifi-sta.sh 直接 source）
#
# 默认值已经和下面对齐，开箱不改也能跑。要改就改下面几行，
# 两块板（AX650 与每台 AX637）之间的 WIFI_* 必须完全一致，否则关联失败。
#
#   WIFI_SSID     1..32 字节        AX650 的 AP，AX637 连它
#   WIFI_PASS     >=8 字节为 WPA2-PSK；空串表示开放网络
#   WIFI_CHANNEL  1..165，>=36 走 5 GHz（本版本只在 5 GHz 验证过）
#
WIFI_SSID=AX650-SDIO-AP
WIFI_PASS=ax650sdio
WIFI_CHANNEL=36

# ---------------------------------------------------------------------------
# 上行（uplink）：AX650 同时做 STA 连一个外部网络，数据走这条路
#
# 一颗 C5 同时做 AP 和 STA（EH_MODE=apsta），所以：
#   - 外部 AP 必须与 WIFI_CHANNEL 同信道，否则连不上；
#   - 外部网络不存在时置 UPLINK_ENABLE=0：STA 连不上会反复扫描，
#     每次扫描都抢占 AP，AX637 侧表现为 reason=2 + 大量丢包。
#
# AX650 的 ethap0 固定是 192.168.4.1/24。若外部网络也正好是
# 192.168.4.0/24，两个网段会打架（见 docs/02-WIFI_INTEGRATION.md 3.2 第 6 条）。
# ---------------------------------------------------------------------------
UPLINK_ENABLE=1
UPLINK_SSID=chl
UPLINK_PASS=1234567890

# 外部 AP 的信道（只用于一致性告警，不会自动改 WIFI_CHANNEL）
#UPLINK_CHANNEL=36

# 是否保留 uplink 的默认路由。默认 0 = 删掉，避免顶掉有线 SSH 的回程；
# 要让 AX650 通过外网出网才置 1。
#UPLINK_DEFAULT_ROUTE=0

# ---------------------------------------------------------------------------
# 下面几项都有合理默认，通常不用动
# ---------------------------------------------------------------------------

# AX637：跳过 DHCP，直接用静态地址（改了要保证两台不重复）
#WIFI_STATIC_IP=192.168.4.12

# 设备号，等价于 $TSF_ROOT/device-id 文件。写 1..9 会让 DHCP 请求
# 192.168.4.1<id>（第一台 .11、第二台 .12）；不写则用 MAC 后 4 位做身份，
# 地址由 DHCP 随机分配，发现机制照样工作。
#TSF_DEVICE_ID=1

# 超时（秒）
#WIFI_UP_TIMEOUT=90
#DHCP_TIMEOUT=45
#UPLINK_UP_TIMEOUT=30
